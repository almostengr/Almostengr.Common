name: Pull request

on:
    pull_request:
        types:
            - opened

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@main
      
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@main
      with:
        dotnet-version: 10.x
        
    - name: Build
      run: dotnet build -c Release
      
    - name: Test
      run: dotnet test -c Release --no-build
    